<!-- base.html -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ seriesTitle | default("Digital Scholarly Edition") }}{% endblock %}</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    /* Darker grey header background (full width) */
    header {
      background-color: #4a4a4a;
      color: #fff;
      padding: 1rem 0;
      margin-bottom: 0;
      width: 100%; /* full browser width for the header background */
    }

    /* Navbar also uses the dark grey background (full width) */
    nav.navbar {
      background-color: #4a4a4a;
      margin-bottom: 2rem; /* spacing below nav, before content */
      width: 100%;
    }

    /* Force nav links to appear white on dark background */
    nav.navbar a.nav-link {
      color: #fff !important;
    }

    /* Constrain the actual nav text to 70% width, centered (like main content) */
    #nav-wrapper {
      width: 70%;
      margin: 0 auto; 
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Main content also 70% wide, centered */
    #content-wrapper {
      width: 70%;
      margin: 0 auto; /* center horizontally */
    }

    .persName { 
      font-weight: bold; 
      color: darkred; 
    }
    .placeName { 
      font-weight: bold; 
      color: #0056b3; 
    }
    .closer, .postscript { 
      font-style: italic; 
      margin-top: 1rem; 
    }
    .tei-code-block {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      padding: 10px;
      font-family: monospace;
      max-height: 400px;
      overflow-y: scroll;
    }

    /* Letter listings */
    .letter-entry {
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .status-label {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 0.9em;
    }
    .original { 
      background-color: #28a745; 
      color: white; 
    }
    .translation { 
      background-color: #007bff; 
      color: white; 
    }
    .in-progress { 
      background-color: #ffc107; 
      color: black; 
    }
  </style>
</head>

<body>

  <!-- Header (dark grey, full width) -->
  <header class="text-center">
    <h1 class="mb-0">{{ seriesTitle | default("Digital Scholarly Edition") }}</h1>
  </header>

  <!-- Navbar (dark grey, full width) -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <!-- #nav-wrapper ensures the navigation links are also at 70% width, centered -->
    <div id="nav-wrapper">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" 
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Nav links (Home, Timeline, etc.) -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <!-- Only Home and Timeline links -->
          <li class="nav-item">
            <a class="nav-link" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/timeline">Timeline</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main content container (70% width, centered) -->
  <div id="content-wrapper">
    {% block content %}{% endblock %}
  </div>

  <!-- Footer (full width, default background) -->
  <footer class="text-center py-3">
    &copy; 2025 Promptotype Martina Scholger
  </footer>

  <!-- Bootstrap JS (with Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
      tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
      });
    });
  </script>
</body>
</html>
